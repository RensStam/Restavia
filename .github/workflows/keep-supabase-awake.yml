name: Keep Supabase awake

# Houdt het gratis Supabase-project wakker (Supabase pauzeert free-tier
# projecten bij "onvoldoende activiteit" over een week).
#
# Drie keer per dag:
#  1. Status controleren via de Supabase Management API. Is het project toch
#     gepauzeerd, dan wordt het automatisch weer opgestart ("restore") en
#     faalt deze run bewust, zodat GitHub je een e-mail stuurt.
#     Vereist het GitHub-secret SUPABASE_ACCESS_TOKEN (persoonlijke token uit
#     supabase.com → Account → Access Tokens). Zonder token wordt deze stap
#     overgeslagen; de rest werkt dan gewoon.
#  2. Echte activiteit: één kleine schrijfactie (rpc keepalive_ping, zie
#     supabase/keepalive.sql) plus een paar leesverzoeken op echte tabellen.
#
# LET OP: GitHub schakelt geplande workflows uit na 60 dagen zonder
# repo-activiteit. Zolang je regelmatig deployt is dat geen probleem; anders
# in het tabblad Actions op "Run workflow" klikken.

on:
  schedule:
    - cron: "17 3 * * *"    # 03:17 UTC
    - cron: "43 11 * * *"   # 11:43 UTC
    - cron: "29 19 * * *"   # 19:29 UTC
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: bbumyqthhyizsmgyqfue
      SUPABASE_URL: https://bbumyqthhyizsmgyqfue.supabase.co
      SUPABASE_KEY: sb_publishable_F53OcwgOGEkpoFkBJgceQw_qjKpQvv0
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Status controleren (en zo nodig automatisch herstellen)
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Geen SUPABASE_ACCESS_TOKEN ingesteld — automatisch herstellen staat uit."
            exit 0
          fi
          status=$(curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.status // "ONBEKEND"')
          echo "Projectstatus: $status"
          if [ "$status" = "INACTIVE" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
            echo "::error::Project was gepauzeerd — herstel gestart (HTTP $code). Over enkele minuten is het weer online."
            exit 1
          fi

      - name: Activiteit — schrijven en lezen
        run: |
          fail=0
          w=$(curl -s -o /tmp/rpc.json -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{"p_source":"github"}')
          if [ "$w" = "200" ]; then
            echo "Schrijfactie gelukt: $(cat /tmp/rpc.json)"
          else
            echo "::warning::keepalive_ping gaf HTTP $w — is supabase/keepalive.sql al uitgevoerd?"
          fi
          for t in "protocols?select=id&limit=5" "app_settings?select=key&limit=5" "categories?select=id&limit=5"; do
            r=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/$t" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
            echo "Lezen ${t%%\?*}: HTTP $r"
            [ "$r" = "200" ] || fail=1
          done
          if [ "$fail" = "1" ]; then
            echo "::error::Lezen mislukt — project mogelijk gepauzeerd of sleutel/endpoint gewijzigd."
            exit 1
          fi
          echo "Project is wakker gehouden."
